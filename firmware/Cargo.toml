[package]
name = "nixieclock-firmware"
version = "0.8.0"
edition = "2024"
description = "ESP32 приложение на базе esp32-wifi-bootloader: WiFi OTA, rollback guard, WiFi-логи"

[features]
default = ["display"]
display = []

[dependencies]
clock-core = { path = "../core" }
embassy-executor = "0.10.0"
embassy-net = { version = "0.9.0", features = ["dhcpv4", "medium-ethernet", "tcp", "dns", "udp"] }
embassy-net-driver = "0.2.0"
embassy-sync = "0.8.0"
embassy-time = "0.5.0"
embedded-io-async = "0.7.0"
embedded-storage = "0.3.1"
esp-alloc = { version = "0.11.0", features = ["esp32"] }
# panic-handler ОТКЛЮЧЁН: наш собственный #[panic_handler] в crashlog.rs
# (пишет причину в NVS и делает software_reset вместо зависания до RWDT).
esp-backtrace = { version = "0.20.0", default-features = false, features = ["esp32", "println"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32"] }
esp-hal = { version = "1.2.2", features = ["esp32", "log-04", "unstable"] }
esp-metadata-generated = { version = "0.5.3", features = ["esp32"] }
esp-nvs = "0.6.3"
esp-println = { version = "0.18.0", features = ["esp32", "log-04"] }
esp-radio = { version = "1.0.0-beta.1", features = ["esp32", "log-04", "unstable", "wifi"] }
esp-rtos = { version = "0.4.0", features = ["esp32", "embassy", "esp-radio", "log-04"] }
esp-storage = { version = "0.10.0", features = ["esp32", "embedded-storage"] }
# Прямой доступ к регистрам I2S1 (INT_ENA/INT_CLR/OUT_EOF_DES_ADDR): esp-hal
# не отдаёт их наружу, а для тика кадра по OUT_EOF нужен PAC. Версия та же,
# что тянет esp-hal 1.2.2 (0.41.0), — второго экземпляра в дереве не будет.
esp32 = "0.41.0"
heapless = "0.9.3"
nb = "1.1.0"
log = "0.4.22"
reqwless = { version = "0.14.0", default-features = false }
static_cell = "2.1.1"
