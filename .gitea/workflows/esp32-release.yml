name: esp32-app-release
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: esp32-hal
    container:
      image: nora.lolka.ebaniedali/esp32-hal-rust:1.2.4
    steps:
      - name: Install certificate lolka.ebaniedali
        uses: https://gitea.lolka.ebaniedali.ru/Public/git-action-ca-certificate-import@v3
        with:
          certificate: ${{ vars.LOLKA_EBANIEDALI_ROOT_CA }}
          certificate-name: "lolka-ebaniedali-ca.crt"

      - name: Local package cache config
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<EOF
          [source.crates-io]
          replace-with = "nora"

          [source.nora]
          registry = "sparse+${{ vars.NORA_BASE_URL }}/cargo/index/"
          EOF

      - name: Checkout
        uses: https://gitea.lolka.ebaniedali.ru/Public/checkout@v7

      - name: Host unit tests (app-core)
        run: cargo test -p clock-core

      - name: Build firmware + validate OTA image
        env:
          SSID: ${{ secrets.SSID }}
          PASSWORD: ${{ secrets.PASSWORD }}
          LOG_URL: ${{ vars.LOG_URL || 'http://192.168.0.28/logs' }}
          # без секрета используется [env] из firmware/.cargo/config.toml —
          # setup-SoftAP при пустом SSID работает и в release-образе
          SOFTAP_PASS: ${{ secrets.SOFTAP_PASS }}
        run: bash tools/ci_build.sh

      - name: Publish release
        uses: https://gitea.lolka.ebaniedali.ru/Public/gitea-release-action@v1
        env:
          # self-signed CA: node берёт системные корни через NODE_EXTRA_CA_CERTS
          NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/lolka-ebaniedali-ca.crt
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ github.event.repository.name }} ${{ github.ref_name }}"
          body: "app_ota.bin — WiFi OTA-образ (кладётся в слот через /ota?url=... на плате),\nfirmware_uart.bin — merged UART-образ (espflash write-bin 0x0),\napp.elf, sha256.txt"
          files: |
            dist/app_ota.bin
            dist/app.elf
            dist/firmware_uart.bin
            dist/sha256.txt
          sha256sum: true

      # Заливка образа на OTA-сервер раздачи (адрес задаётся переменной репо
      # OTA_PUBLISH_URL; пусто -> стадия пропускается, сервер ещё не выбран).
      - name: Publish to OTA server
        if: ${{ vars.OTA_PUBLISH_URL != '' }}
        env:
          OTA_PUBLISH_URL: ${{ vars.OTA_PUBLISH_URL }}
        run: |
          for f in dist/app_ota.bin dist/sha256.txt; do
            curl --fail -sS --max-time 60 -T "$f" "$OTA_PUBLISH_URL/$(basename "$f")"
            echo "uploaded $(basename "$f") -> $OTA_PUBLISH_URL"
          done
