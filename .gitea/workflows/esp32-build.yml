name: esp32-app-build
on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - master
      - "*/*"

jobs:
  firmware:
    runs-on: esp32-hal
    container:
      image: nora.lolka.ebaniedali/esp32-hal-rust:1.2.4
    steps:
      - name: Install certificate lolka.ebaniedali
        uses: https://gitea.lolka.ebaniedali.ru/Public/git-action-ca-certificate-import@v3
        with:
          certificate: ${{ vars.LOLKA_EBANIEDALI_ROOT_CA }}
          certificate-name: "lolka-ebaniedali-ca.crt"

      - name: Local package cache config
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<EOF
          [source.crates-io]
          replace-with = "nora"

          [source.nora]
          registry = "sparse+${{ vars.NORA_BASE_URL }}/cargo/index/"
          EOF

      - name: Checkout
        uses: https://gitea.lolka.ebaniedali.ru/Public/checkout@v7

      - name: Host unit tests (app-core)
        run: cargo test -p clock-core

      - name: Build firmware + validate OTA image
        env:
          SSID: ${{ secrets.SSID }}
          PASSWORD: ${{ secrets.PASSWORD }}
          LOG_URL: ${{ vars.LOG_URL || 'http://192.168.0.28/logs' }}
          # SoftAP-эвакуация (core::softap) существует только при этом секрете:
          # без него main.rs оставляет softap_creds=None и rescue-AP не поднимается.
          SOFTAP_PASS: ${{ secrets.SOFTAP_PASS }}
        run: bash tools/ci_build.sh

      - name: Upload firmware artifact
        uses: https://gitea.lolka.ebaniedali.ru/Public/upload-artifact@v3.2.2
        with:
          name: esp32-app
          path: dist/*
          retention-days: 7
